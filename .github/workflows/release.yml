name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Run tests
        run: dotnet test --configuration Release --verbosity normal --filter "FullyQualifiedName!~IntegrationTests"

      - name: Publish Release
        run: .\scripts\Publish-Release.ps1 -Version ${{ steps.version.outputs.VERSION }} -Runtime win-x64

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" "installers/windows/Aura.iss"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: publish/installers/Aura-Setup-*.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish Release
        run: pwsh ./scripts/Publish-Release.ps1 -Version ${{ steps.version.outputs.VERSION }} -Runtime osx-arm64 -SkipPostgres

      - name: Create macOS archive
        run: |
          cd publish/osx-arm64
          tar -czf ../Aura-${{ steps.version.outputs.VERSION }}-macos-arm64.tar.gz .

      - name: Upload macOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-archive
          path: publish/Aura-*.tar.gz
          retention-days: 30

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      - name: Download macOS Archive
        uses: actions/download-artifact@v4
        with:
          name: macos-archive
          path: artifacts

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags HEAD^ 2>/dev/null || echo "")
          echo "## Changes" > changelog.md
          echo "" >> changelog.md
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" >> changelog.md
            echo "" >> changelog.md
            git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD >> changelog.md
          else
            echo "Initial release" >> changelog.md
            echo "" >> changelog.md
            git log --pretty=format:"- %s (%h)" -20 >> changelog.md
          fi
          echo "" >> changelog.md

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Aura-Setup-*.exe
            artifacts/Aura-*-macos-arm64.tar.gz
          body_path: changelog.md
          append_body: |

            ## Installation

            ### Windows
            1. Download `Aura-Setup-${{ steps.version.outputs.VERSION }}.exe` and run the installer
            2. The installer bundles PostgreSQL + pgvector
            3. Ensure Ollama is installed: https://ollama.com

            ### macOS
            1. Download and extract `Aura-${{ steps.version.outputs.VERSION }}-macos-arm64.tar.gz`
            2. Install PostgreSQL with pgvector: `brew install postgresql@16 pgvector`
            3. Install Ollama: https://ollama.com
            4. Run `./api/Aura.Api` to start the service, `./tray/Aura.Tray` for status monitor

            ## Requirements
            - Ollama (for local embeddings)
            - PostgreSQL 16+ with pgvector (bundled on Windows, manual on macOS)
          draft: false
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
